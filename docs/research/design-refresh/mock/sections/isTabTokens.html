<sc-if value="{{ isTabTokens }}" hint-placeholder-val="{{ false }}">
      <div style="max-width: 860px;">
        <div style="display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 22px;">
          <div><h1 style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 27px; letter-spacing: -.03em; color: {{ pal.strong }}; margin: 0;">{{ P.tok.title }}</h1><div style="font-size: 13.5px; color: {{ pal.muted }}; margin-top: 4px;">{{ P.tok.sub }}</div></div>
          <button class="qbtn" onClick="{{ openCreate }}" style="background: {{ pal.fill }}; border: none; border-radius: 9px; padding: 9px 15px; color: #0A0B0F; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap;">{{ P.tok.create }}</button>
        </div>
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <sc-for list="{{ tokensView }}" as="tk" hint-placeholder-count="3">
            <div class="qcard-hov" style="background: {{ pal.card }}; border: 1px solid {{ pal.border }}; border-radius: 12px; padding: 16px 18px; box-shadow: {{ pal.shadow }};">
              <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
                <div style="min-width: 0;"><div style="font-size: 14.5px; font-weight: 600; color: {{ pal.strong }};">{{ tk.name }}</div><div style="font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: {{ pal.muted }}; margin-top: 4px;">{{ tk.prefix }}••••••••</div></div>
                <button class="qbtn" style="background: transparent; border: 1px solid {{ pal.border }}; border-radius: 8px; padding: 6px 12px; color: #FF6B6B; font-size: 12.5px; font-weight: 600; cursor: pointer; white-space: nowrap;">{{ P.tok.revoke }}</button>
              </div>
              <div style="display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center;">
                <span style="font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: {{ pal.text }}; background: {{ pal.card2 }}; border-radius: 6px; padding: 3px 9px;">{{ tk.scopeStr }}</span>
                <span style="font-size: 12px; color: {{ pal.muted }};">· {{ tk.rate }}</span>
                <span style="font-size: 12px; color: {{ pal.muted }};">· {{ P.tok.lastUsed }}: {{ tk.lastUsedF }}</span>
              </div>
            </div>
          </sc-for>
        </div>
      </div>
      </sc-if>
