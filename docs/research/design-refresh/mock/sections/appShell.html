<sc-if value="{{ isApp }}" hint-placeholder-val="{{ false }}">
<div style="min-height: 100vh; height: 100vh; display: flex; background: {{ pal.bg }}; color: {{ pal.text }}; font-size: 15px; overflow: hidden;">

  <!-- SIDEBAR -->
  <aside style="width: 250px; flex-shrink: 0; background: {{ pal.ink2 }}; border-right: 1px solid {{ pal.border }}; display: flex; flex-direction: column; padding: 16px 14px;">
    <div style="display: flex; align-items: center; gap: 10px; padding: 6px 8px 16px;">
      <svg width="26" height="26" viewBox="0 0 48 48" fill="none" style="filter: drop-shadow(0 0 8px rgba(198,249,78,.3));"><g stroke="#C6F94E" stroke-width="4" stroke-linecap="round" fill="none"><path d="M14 14 L34 34"></path><path d="M34 14 L14 34"></path></g><circle cx="24" cy="24" r="7" fill="none" stroke="#C6F94E" stroke-width="4"></circle><g fill="#C6F94E"><circle cx="14" cy="14" r="2.6"></circle><circle cx="34" cy="14" r="2.6"></circle><circle cx="14" cy="34" r="2.6"></circle><circle cx="34" cy="34" r="2.6"></circle></g></svg>
      <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: -.04em; color: {{ pal.strong }};">quark</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 1px solid {{ pal.border }}; border-radius: 10px; margin-bottom: 18px; cursor: pointer;" class="qlift">
      <div style="width: 26px; height: 26px; border-radius: 7px; background: linear-gradient(135deg, #C6F94E, #4ADEDE); display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 12px; color: #0A0B0F; flex-shrink: 0;">A</div>
      <div style="flex: 1; min-width: 0;">
        <div style="font-size: 13.5px; font-weight: 600; color: {{ pal.strong }}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Acme Inc</div>
        <div style="font-size: 11px; color: {{ pal.muted }};">{{ P.plan }}</div>
      </div>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{ pal.muted }}" stroke-width="2" stroke-linecap="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
    </div>

    <div style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .12em; color: {{ pal.muted }}; padding: 0 10px 8px;">{{ P.groupMain }}</div>
    <div style="display: flex; flex-direction: column; gap: 3px;">
      <button class="qbtn qlift" onClick="{{ navLinks }}" style="display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; background: {{ ns.links.bg }}; border: none; border-radius: 9px; padding: 9px 11px; color: {{ ns.links.c }}; font-size: 14.5px; font-weight: 500; cursor: pointer; white-space: nowrap;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{ ns.links.c }}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.5 1.5"></path><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.5-1.5"></path></svg>{{ P.nav.links }}
      </button>
      <button class="qbtn qlift" onClick="{{ navAnalytics }}" style="display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; background: {{ ns.analytics.bg }}; border: none; border-radius: 9px; padding: 9px 11px; color: {{ ns.analytics.c }}; font-size: 14.5px; font-weight: 500; cursor: pointer; white-space: nowrap;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{ ns.analytics.c }}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="10"></line><line x1="18" y1="20" x2="18" y2="4"></line><line x1="6" y1="20" x2="6" y2="15"></line></svg>{{ P.nav.analytics }}
      </button>
    </div>

    <div style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .12em; color: {{ pal.muted }}; padding: 20px 10px 8px;">{{ P.groupSettings }}</div>
    <div style="display: flex; flex-direction: column; gap: 3px;">
      <button class="qbtn qlift" onClick="{{ navDomains }}" style="display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; background: {{ ns.domains.bg }}; border: none; border-radius: 9px; padding: 9px 11px; color: {{ ns.domains.c }}; font-size: 14.5px; font-weight: 500; cursor: pointer; white-space: nowrap;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{ ns.domains.c }}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18"></path><path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18"></path></svg>{{ P.nav.domains }}
      </button>
      <button class="qbtn qlift" onClick="{{ navMembers }}" style="display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; background: {{ ns.members.bg }}; border: none; border-radius: 9px; padding: 9px 11px; color: {{ ns.members.c }}; font-size: 14.5px; font-weight: 500; cursor: pointer; white-space: nowrap;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{ ns.members.c }}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"></path><circle cx="10" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path></svg>{{ P.nav.members }}
      </button>
      <button class="qbtn qlift" onClick="{{ navTokens }}" style="display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; background: {{ ns.tokens.bg }}; border: none; border-radius: 9px; padding: 9px 11px; color: {{ ns.tokens.c }}; font-size: 14.5px; font-weight: 500; cursor: pointer; white-space: nowrap;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{ ns.tokens.c }}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="3.5"></circle><path d="M10 13l9-9"></path><path d="M16 6l3 3"></path></svg>{{ P.nav.tokens }}
      </button>
      <button class="qbtn qlift" onClick="{{ navWebhooks }}" style="display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; background: {{ ns.webhooks.bg }}; border: none; border-radius: 9px; padding: 9px 11px; color: {{ ns.webhooks.c }}; font-size: 14.5px; font-weight: 500; cursor: pointer; white-space: nowrap;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{ ns.webhooks.c }}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"></path></svg>{{ P.nav.webhooks }}
      </button>
    </div>

    <div style="flex: 1;"></div>
    <div style="background: {{ pal.wash }}; border: 1px solid rgba(198,249,78,.24); border-radius: 11px; padding: 13px; margin-bottom: 12px;">
      <div style="font-size: 12.5px; font-weight: 600; color: {{ pal.strong }};">{{ P.plan }}</div>
      <div style="font-size: 11.5px; color: {{ pal.muted }}; margin: 3px 0 9px;">{{ seatsUsed }} · {{ P.mem.seats }}</div>
      <button class="qbtn" onClick="{{ goLanding }}" style="width: 100%; background: {{ pal.fill }}; border: none; border-radius: 8px; padding: 7px; color: #0A0B0F; font-size: 12.5px; font-weight: 700; cursor: pointer;">{{ P.upgrade }}</button>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 8px 6px; border-top: 1px solid {{ pal.border }}; padding-top: 12px;">
      <div style="width: 30px; height: 30px; border-radius: 50%; background: #C6F94E; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 12px; color: #0A0B0F;">LO</div>
      <div style="flex: 1; min-width: 0;">
        <div style="font-size: 13px; font-weight: 600; color: {{ pal.strong }};">Lucas Olopes</div>
        <div style="font-size: 11px; color: {{ pal.muted }};">lucas@acme.com</div>
      </div>
      <button class="qbtn" onClick="{{ goLanding }}" style="background: transparent; border: none; cursor: pointer; padding: 4px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{ pal.muted }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg></button>
    </div>
  </aside>

  <!-- MAIN -->
  <div style="flex: 1; display: flex; flex-direction: column; min-width: 0;">
    <!-- TOPBAR -->
    <header style="height: 62px; flex-shrink: 0; border-bottom: 1px solid {{ pal.border }}; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 26px; background: {{ pal.bg }};">
      <div style="flex: 1; max-width: 440px; display: flex; align-items: center; gap: 10px; background: {{ pal.card2 }}; border: 1px solid {{ pal.border }}; border-radius: 10px; padding: 0 13px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{ pal.muted }}" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input placeholder="{{ P.search }}" style="flex: 1; background: transparent; border: none; outline: none; color: {{ pal.text }}; font-size: 14px; padding: 9px 0;">
      </div>
      <div style="display: flex; align-items: center; gap: 10px;">
        <button class="qbtn" onClick="{{ toggleLang }}" style="background: transparent; border: 1px solid {{ pal.border }}; border-radius: 8px; padding: 7px 10px; color: {{ pal.muted }}; font-family: 'JetBrains Mono', monospace; font-size: 11px; cursor: pointer; white-space: nowrap;">{{ t.nav.langLabel }}</button>
        <button class="qbtn" onClick="{{ toggleTheme }}" style="background: transparent; border: 1px solid {{ pal.border }}; border-radius: 8px; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; color: {{ pal.muted }}; cursor: pointer;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{ pal.muted }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"></path></svg>
        </button>
        <button class="qbtn" onClick="{{ openCreate }}" style="display: flex; align-items: center; gap: 7px; background: {{ pal.fill }}; border: none; border-radius: 9px; padding: 9px 15px; color: #0A0B0F; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0A0B0F" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>{{ P.newLink }}
        </button>
      </div>
    </header>

    <!-- CONTENT -->
    <main style="flex: 1; overflow: auto; padding: 26px 30px 60px;">

      <!-- ===== LINKS TAB ===== -->
      <!-- >>> isTabLinks (ver sections/isTabLinks.html) <<< -->

      <!-- ===== ANALYTICS TAB ===== -->
      <!-- >>> isTabAnalytics (ver sections/isTabAnalytics.html) <<< -->

      <!-- ===== DOMAINS TAB ===== -->
      <!-- >>> isTabDomains (ver sections/isTabDomains.html) <<< -->

      <!-- ===== MEMBERS TAB ===== -->
      <!-- >>> isTabMembers (ver sections/isTabMembers.html) <<< -->

      <!-- ===== TOKENS TAB ===== -->
      <!-- >>> isTabTokens (ver sections/isTabTokens.html) <<< -->

      <!-- ===== WEBHOOKS TAB ===== -->
      <!-- >>> isTabWebhooks (ver sections/isTabWebhooks.html) <<< -->

    </main>
  </div>

  <!-- ===== CREATE DIALOG ===== -->
  <!-- >>> createOpen (ver sections/createOpen.html) <<< -->

</div>
</sc-if>
