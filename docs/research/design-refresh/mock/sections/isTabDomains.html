<sc-if value="{{ isTabDomains }}" hint-placeholder-val="{{ false }}">
      <div style="max-width: 860px;">
        <div style="display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 22px;">
          <div><h1 style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 27px; letter-spacing: -.03em; color: {{ pal.strong }}; margin: 0;">{{ P.dom.title }}</h1><div style="font-size: 13.5px; color: {{ pal.muted }}; margin-top: 4px;">{{ P.dom.sub }}</div></div>
          <button class="qbtn" onClick="{{ openCreate }}" style="background: {{ pal.fill }}; border: none; border-radius: 9px; padding: 9px 15px; color: #0A0B0F; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap;">{{ P.dom.add }}</button>
        </div>
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <sc-for list="{{ domainsView }}" as="dm" hint-placeholder-count="3">
            <div class="qcard-hov" style="display: flex; align-items: center; gap: 14px; background: {{ pal.card }}; border: 1px solid {{ pal.border }}; border-radius: 12px; padding: 16px 18px; box-shadow: {{ pal.shadow }};">
              <div style="width: 38px; height: 38px; border-radius: 9px; background: {{ pal.card2 }}; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{ pal.muted }}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18"></path><path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18"></path></svg></div>
              <div style="flex: 1;">
                <div style="display: flex; align-items: center; gap: 9px;"><span style="font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 500; color: {{ pal.strong }};">{{ dm.host }}</span><sc-if value="{{ dm.primary }}" hint-placeholder-val="{{ false }}"><span style="font-size: 10px; letter-spacing: .06em; color: {{ pal.brand }}; background: {{ pal.wash }}; border-radius: 5px; padding: 2px 7px;">{{ P.dom.primary }}</span></sc-if></div>
                <div style="font-size: 12.5px; color: {{ pal.muted }}; margin-top: 4px;">{{ dm.links }} {{ P.dom.links }}</div>
              </div>
              <div style="display: flex; align-items: center; gap: 8px;"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{ dm.sc }};"></span><span style="font-size: 13px; color: {{ pal.text }};">{{ dm.slabel }}</span></div>
              <sc-if value="{{ dm.primary }}" hint-placeholder-val="{{ false }}"></sc-if>
            </div>
          </sc-for>
        </div>
      </div>
      </sc-if>
