<sc-if value="{{ isLogin }}" hint-placeholder-val="{{ false }}">
<div style="min-height: 100vh; background: #0A0B0F; color: #E8EAF2; display: flex; flex-direction: column; position: relative; overflow: hidden;">
  <div style="position: absolute; inset: 0; pointer-events: none; background: radial-gradient(680px 460px at 50% -6%, rgba(198,249,78,.1), transparent 62%);"></div>
  <div style="position: absolute; inset: 0; pointer-events: none; opacity: .45; -webkit-mask-image: radial-gradient(700px 500px at 50% 24%, #000, transparent 76%); mask-image: radial-gradient(700px 500px at 50% 24%, #000, transparent 76%); background-image: linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px); background-size: 46px 46px;"></div>
  <div style="position: relative; padding: 22px 40px;">
    <button class="qbtn" onClick="{{ goLanding }}" style="display: inline-flex; align-items: center; gap: 8px; background: transparent; border: none; color: #8A90A2; font-size: 14px; cursor: pointer;">{{ t.login.back }}</button>
  </div>
  <div style="position: relative; flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px 40px 60px;">
    <div style="width: 100%; max-width: 400px; animation: qrise .5s cubic-bezier(.23,1,.32,1) both;">
      <div style="display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 30px;">
        <svg width="42" height="42" viewBox="0 0 48 48" fill="none" style="filter: drop-shadow(0 0 14px rgba(198,249,78,.4)); margin-bottom: 18px;"><g stroke="#C6F94E" stroke-width="4" stroke-linecap="round" fill="none"><path d="M14 14 L34 34"></path><path d="M34 14 L14 34"></path></g><circle cx="24" cy="24" r="7" fill="none" stroke="#C6F94E" stroke-width="4"></circle><g fill="#C6F94E"><circle cx="14" cy="14" r="2.6"></circle><circle cx="34" cy="14" r="2.6"></circle><circle cx="14" cy="34" r="2.6"></circle><circle cx="34" cy="34" r="2.6"></circle></g></svg>
        <h1 style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: -.03em; color: #F5F7FC; margin: 0;">{{ t.login.title }}</h1>
        <p style="margin: 8px 0 0; font-size: 14.5px; color: #8A90A2;">{{ t.login.sub }}</p>
      </div>
      <div style="background: #131521; border: 1px solid rgba(255,255,255,.1); border-radius: 16px; padding: 26px; box-shadow: 0 30px 70px -36px rgba(0,0,0,.9);">
        <button class="qbtn" onClick="{{ goApp }}" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; background: #FFFFFF; border: none; border-radius: 10px; padding: 11px; font-size: 14.5px; font-weight: 600; color: #1a1a1a; cursor: pointer;">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"></path><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"></path><path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84z"></path><path fill="#EA4335" d="M12 4.75c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 1.44 14.97.5 12 .5A11 11 0 0 0 2.18 7.06l3.66 2.84C6.71 7.3 9.14 4.75 12 4.75z"></path></svg>
          {{ t.login.google }}
        </button>
        <div style="display: flex; align-items: center; gap: 12px; margin: 20px 0;">
          <div style="flex: 1; height: 1px; background: rgba(255,255,255,.09);"></div>
          <span style="font-size: 12px; color: #6B7180;">{{ t.login.or }}</span>
          <div style="flex: 1; height: 1px; background: rgba(255,255,255,.09);"></div>
        </div>
        <label style="display: block; font-size: 13px; color: #A6ABBB; margin-bottom: 7px;">{{ t.login.email }}</label>
        <input placeholder="{{ t.login.emailPh }}" style="width: 100%; background: #0F1119; border: 1px solid rgba(255,255,255,.14); border-radius: 10px; padding: 11px 13px; color: #E8EAF2; font-size: 14.5px; outline: none; margin-bottom: 16px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px;">
          <label style="font-size: 13px; color: #A6ABBB;">{{ t.login.password }}</label>
          <a href="#" style="font-size: 12.5px;">{{ t.login.forgot }}</a>
        </div>
        <input type="password" placeholder="{{ t.login.passwordPh }}" style="width: 100%; background: #0F1119; border: 1px solid rgba(255,255,255,.14); border-radius: 10px; padding: 11px 13px; color: #E8EAF2; font-size: 14.5px; outline: none; margin-bottom: 20px;">
        <button class="qbtn" onClick="{{ goApp }}" style="width: 100%; background: #C6F94E; border: none; border-radius: 10px; padding: 12px; color: #0A0B0F; font-size: 15px; font-weight: 700; cursor: pointer;">{{ t.login.submit }}</button>
        <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,.07);">
          <button class="qbtn" onClick="{{ goApp }}" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; background: transparent; border: 1px solid rgba(255,255,255,.14); border-radius: 10px; padding: 10px; color: #C4C8D4; font-family: 'JetBrains Mono', monospace; font-size: 13px; cursor: pointer;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8A90A2" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            {{ t.login.token }}
          </button>
        </div>
      </div>
      <div style="text-align: center; margin-top: 20px; font-size: 14px; color: #8A90A2;">{{ t.login.noAccount }} <a href="#" onClick="{{ goApp }}" style="font-weight: 600;">{{ t.login.signup }}</a></div>
      <div style="text-align: center; margin-top: 16px; font-size: 12px; color: #5b6072; line-height: 1.5;">{{ t.login.terms }}</div>
    </div>
  </div>
</div>
</sc-if>
