name: Release

on:
  push:
    tags:
      - "v*"

# Privilegio minimo por padrao. Cada job eleva so o que precisa.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: lucasolopes/quark

jobs:
  # Gate barato antes de gastar tempo de build. Sem isso a imagem pode sair
  # com --version mentindo (tag e Cargo.toml divergentes), e isso e uma falha
  # silenciosa: ninguem percebe ate reportar um bug com a versao errada.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag e Cargo.toml precisam concordar
        id: v
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"

          cargo_version="$(sed -n '/^\[package\]/,/^\[/p' Cargo.toml \
            | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)"

          if [ "$cargo_version" != "$version" ]; then
            echo "::error::tag $tag nao bate com a versao do Cargo.toml ($cargo_version)"
            exit 1
          fi

          if ! grep -qF "## [$version]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md nao tem uma secao '## [$version]'"
            exit 1
          fi

          case "$version" in
            *-*) prerelease=true ;;
            *)   prerelease=false ;;
          esac

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  # Um job por arquitetura, cada um no runner NATIVO daquela arquitetura.
  # Nunca adicionar docker/setup-qemu-action aqui: com QEMU presente o buildx
  # pode preferir o emulador em vez do runner arm64 nativo, e um build de
  # poucos minutos vira 90+ sem nenhum aviso, ate estourar o timeout do job.
  build:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # push-by-digest publica so o blob, sem criar nenhuma tag. O manifest
      # list final (com as tags semanticas de verdade) so existe depois do
      # job publish. Sem isso, cada release deixaria tags orfas tipo
      # ":build-amd64-<sha>" visiveis para qualquer um que liste os pacotes
      # do projeto num registry publico.
      - name: Build e push da imagem desta arquitetura (por digest)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          # Scope por arquitetura. Sem isso os dois jobs escrevem na mesma
          # entrada de cache e toda release comeca fria.
          cache-from: type=gha,scope=release-linux-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-linux-${{ matrix.arch }}

      - name: Exporta o digest desta arquitetura
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      # Nome unico por perna da matrix: upload-artifact rejeita nomes
      # duplicados quando os dois jobs rodam em paralelo.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Junta os dois manifests por arquitetura num unico manifest list (a
  # "imagem multiarch" que o Docker resolve sozinho por plataforma) e so
  # entao aplica as tags semanticas finais.
  publish:
    needs: [guard, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags semanticas para o manifest final
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # latest=false porque o latest=auto padrao marcaria latest ate numa
          # prerelease tipo v0.3.0-rc.1. O type=raw abaixo controla o latest
          # de verdade, condicionado a guard.outputs.prerelease.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.guard.outputs.prerelease == 'false' }}

      # Monta o manifest a partir dos DIGESTS baixados dos artifacts, nunca
      # de uma tag intermediaria. Nenhum blob por arquitetura fica com tag
      # propria no registry; a unica coisa visivel publicamente sao as tags
      # semanticas finais aplicadas aqui.
      - name: Cria e publica o manifest list multiarch
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Le o digest do indice (manifest list)
        id: index
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$VERSION" \
            --format '{{ json .Manifest }}' | jq -r .digest)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Confere que as duas plataformas estao no indice
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          out="$(docker buildx imagetools inspect \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$VERSION")"
          echo "$out"
          echo "$out" | grep -q 'linux/amd64'
          echo "$out" | grep -q 'linux/arm64'

      # Atesta o digest do INDICE, nunca dentro do job de matrix. E o digest
      # do indice que o usuario alcanca pela tag; atestar os manifests por
      # arquitetura deixa esse digest sem attestation e "gh attestation
      # verify" falha para quem so descobre isso depois de reclamar.
      - name: Atesta a proveniencia do build
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

  release:
    needs: [guard, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extrai a secao desta versao do CHANGELOG
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          awk -v v="## [$VERSION]" '
            index($0, v) == 1  { grab = 1; next }
            grab && /^## \[/   { exit }
            grab && /^\[.*\]: http/ { exit }
            grab               { print }
          ' CHANGELOG.md > /tmp/notes.md

          cat >> /tmp/notes.md <<EOF

          ## Imagem do container

          \`\`\`
          docker pull ghcr.io/lucasolopes/quark:$VERSION
          \`\`\`

          Plataformas: \`linux/amd64\`, \`linux/arm64\`.
          Digest: \`$DIGEST\`

          Verifique a proveniencia do build:

          \`\`\`
          gh attestation verify oci://ghcr.io/lucasolopes/quark:$VERSION --repo lucasolopes/quark
          \`\`\`
          EOF

      - name: Cria a GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: /tmp/notes.md
          prerelease: ${{ needs.guard.outputs.prerelease }}
          make_latest: ${{ needs.guard.outputs.prerelease == 'false' }}

  # Producao. Este e o UNICO caminho que deploya: nem push na main, nem merge de
  # PR sobem qualquer coisa. Cloud e self-hoster passam a rodar exatamente o
  # mesmo artefato, e o header X-Quark-Version deixa de poder mentir, porque a
  # unica coisa que chega em producao e uma tag que o guard ja conferiu contra
  # o Cargo.toml.
  #
  # Prerelease NAO deploya. Uma tag como v0.3.0-rc.1 exercita o pipeline
  # inteiro (build multiarch, publish, attestation) sem tocar em producao, o
  # que e a forma barata de ensaiar uma mudanca arriscada no proprio pipeline.
  # O painel e buildado num job SEM nenhum secret. `npm ci` executa os scripts
  # de lifecycle de todo o grafo de dependencias do web/, e um postinstall
  # comprometido num job que carrega FLY_API_TOKEN e CLOUDFLARE_API_TOKEN
  # exfiltraria as credenciais de producao. Aqui ele so pode ver o que um PR
  # qualquer ja ve. O dist sai por artifact.
  panel:
    needs: guard
    if: needs.guard.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build do painel
        working-directory: web
        env:
          # Embutido em build time pelo Vite. Se ficar vazio o painel cai no
          # window.location.origin e passa a chamar a si mesmo em vez da API.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          set -euo pipefail
          test -n "$VITE_API_BASE_URL" || { echo "::error::VITE_API_BASE_URL vazio"; exit 1; }
          npm ci
          npm run build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: panel-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: [guard, publish, panel]
    if: needs.guard.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Backend: deploya a imagem QUE ACABOU DE SER PUBLICADA, por digest, nao
      # por tag. Digest e imutavel; uma tag poderia ser reescrita entre o
      # publish e o deploy. E `--image` faz o Fly pular o builder remoto dele,
      # entao producao roda o mesmo bit que o CI testou e que foi atestado, em
      # vez de um rebuild a partir do fonte.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master@2026-07-24
      - name: Deploy do backend no Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST" || { echo "::error::digest vazio vindo do publish"; exit 1; }
          flyctl deploy --image "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      # Frontend: so o dist ja pronto, baixado do job panel. Nenhum npm roda
      # neste job, entao nenhum codigo de dependencia chega perto dos tokens.
      # O auto-deploy da branch de producao no Cloudflare Pages fica DESLIGADO
      # no dashboard.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: panel-dist
          path: web/dist

      - name: Deploy do painel no Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ID_ACCOUNT }}
          # Pinado: sem isto a action instala o wrangler mais recente do npm em
          # tempo de execucao, num job que carrega tokens de producao.
          wranglerVersion: "4.42.0"
          command: pages deploy web/dist --project-name=${{ vars.CF_PAGES_PROJECT }} --branch=${{ vars.CF_PAGES_PRODUCTION_BRANCH }}

      # Confere no ar, contra o dominio publico, que producao esta mesmo na
      # versao que acabou de sair. Sem isto o job fica verde mesmo se o Fly
      # aceitar o deploy e as maquinas voltarem na imagem antiga.
      - name: Confere a versao em producao
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          HEALTH_URL: ${{ vars.PROD_HEALTH_URL }}
        run: |
          set -euo pipefail
          test -n "$HEALTH_URL" || { echo "::error::PROD_HEALTH_URL vazio"; exit 1; }
          for i in $(seq 1 20); do
            # O "|| true" e obrigatorio: com set -e, um curl -f que pegue 502
            # durante o restart das maquinas abortaria o passo na PRIMEIRA
            # tentativa, que e justamente a janela para a qual este laco existe.
            head="$(curl -fsS -m 10 -D- -o /dev/null "$HEALTH_URL" 2>/dev/null || true)"
            # A captura para no primeiro espaco, entao o \r do CRLF do HTTP
            # fica de fora sem precisar de um tr a parte (e um tr de [:cntrl:]
            # comeria as quebras de linha e o sed nunca casaria).
            got="$(printf '%s' "$head" \
              | sed -n 's/^[Xx]-[Qq]uark-[Vv]ersion:[[:space:]]*\([^[:space:]]*\).*/\1/p')"
            if [ "$got" = "$VERSION" ]; then
              echo "producao esta em $got"
              exit 0
            fi
            echo "tentativa $i: producao responde '${got:-vazio}', esperado '$VERSION'"
            sleep 15
          done
          echo "::error::producao nao chegou na versao $VERSION"
          exit 1
