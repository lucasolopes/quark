name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Privilegio minimo por padrao. So o job que precisar de mais eleva localmente.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      valkey:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 5
      clickhouse:
        image: clickhouse/clickhouse-server:24
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget -q -O - http://localhost:8123/ping || exit 1" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (stable + rustfmt + clippy)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      # A edicao Enterprise (`src/ee/`) nao entra no build padrao, entao sem um
      # job proprio ela quebra sem ninguem ver (LUC-19).
      - name: Clippy Enterprise (deny warnings)
        run: cargo clippy --all-targets --features ee -- -D warnings

      - name: Build
        run: cargo build --release

      # Os testes gated NAO podem rodar como superusuario: o Postgres isenta
      # superusuario de RLS a menos que a role tenha NOBYPASSRLS, e o
      # FORCE ROW LEVEL SECURITY do modo cloud e justamente o mecanismo de
      # isolamento entre tenants. Rodando como postgres, o RLS nunca era
      # exercitado e so o predicado WHERE tenant_id da aplicacao era testado.
      # A role abaixo espelha producao: sem superusuario, dona do proprio banco
      # (o dono do banco herda CREATE no schema public a partir do PG15).
      - name: Create non-superuser test role
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE quark_test LOGIN PASSWORD 'quark_test' NOSUPERUSER NOBYPASSRLS NOCREATEROLE;
          CREATE DATABASE quark_test OWNER quark_test;
          SQL

      - name: Test
        # --no-fail-fast: cargo test para na primeira binaria que falha e
        # esconde as demais. Numa rodada quebrada isso mostra tudo de uma vez.
        run: cargo test --no-fail-fast
        env:
          QUARK_TEST_VALKEY_URL: redis://127.0.0.1:6379
          QUARK_TEST_DATABASE_URL: postgres://quark_test:quark_test@127.0.0.1:5432/quark_test
          QUARK_TEST_CLICKHOUSE_URL: http://127.0.0.1:8123

      - name: Test Enterprise
        run: cargo test --features ee --no-fail-fast
        env:
          QUARK_TEST_VALKEY_URL: redis://127.0.0.1:6379
          QUARK_TEST_DATABASE_URL: postgres://quark_test:quark_test@127.0.0.1:5432/quark_test
          QUARK_TEST_CLICKHOUSE_URL: http://127.0.0.1:8123

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:ee
      - run: npm run build
      - run: npm run build
        env:
          VITE_QUARK_EE: "1"

  # A separacao open-core so e real se o core continuar utilizavel sozinho
  # (LUC-19). Este job apaga as duas pastas Enterprise e exige que tudo passe
  # sem elas. Se quebrar, `src/ee/` virou dependencia do core e a licenca da
  # raiz deixou de ser verdade.
  community-only:
    name: community build without src/ee
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Delete the Enterprise directories
        run: rm -rf src/ee web/src/ee

      - name: Build and test the core alone
        run: cargo build && cargo test --no-fail-fast

      - name: Build the panel alone
        working-directory: web
        run: npm ci && npm run typecheck && npm run test && npm run build
